AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Market Dashboard readiness, Gmail ingestion, and consolidated Hermes workers.

Parameters:
  CloudWatchdogScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable the independent read-only watchdog only through staged activation.
  GmailScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Kept disabled until production OAuth is promoted and the canary is ready.
  QuantAnalystScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable only after the analyst worker canary is ready.
  QuantDeveloperScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable only after the developer worker canary is ready.
  SecurityScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable only after the security worker canary is ready.
  OperationalAlarmsState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Alarm actions and missing-heartbeat evaluation enable after canary observation.
  ReservedConcurrencyState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Opt in only after the account concurrency quota can preserve ten unreserved executions.
  AlertEmail:
    Type: String
    Default: timsmithaviation@gmail.com
  GmailOAuthSecretName:
    Type: String
    Default: hermes/gmail/oauth
  RawArtifactBucketName:
    Type: String
    Default: market-dashboard-csv-data
  GmailLedgerTableName:
    Type: String
    Default: HermesEmailIngestLedger
  HedgeyeDailySnapshotTableName:
    Type: String
    Default: HedgeyeDailySnapshot
  HedgeyeRiskRangesTableName:
    Type: String
    Default: HedgeyeRiskRanges
  RiskRangeHistoryTableName:
    Type: String
    Default: RiskRangeData
  HermesAgentRunsTableName:
    Type: String
    Default: HermesAgentRuns
  HermesAlertsTableName:
    Type: String
    Default: HermesAlerts
  BridgeHostId:
    Type: String
    Default: tim-market-dashboard
  BuildVersion:
    Type: String
    Default: development

Conditions:
  OperationalAlarmsEnabled: !Equals [!Ref OperationalAlarmsState, ENABLED]
  ReservedConcurrencyEnabled: !Equals [!Ref ReservedConcurrencyState, ENABLED]

Globals:
  Function:
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        BUILD_VERSION: !Ref BuildVersion
        SERVICE_HEARTBEAT_TABLE: !Ref ServiceHeartbeatTable
    Tags:
      Application: market-dashboard
      ManagedBy: aws-sam

Resources:
  ServiceHeartbeatTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: MarketDashboardServiceHeartbeats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serviceId
          AttributeType: S
        - AttributeName: observedAt
          AttributeType: S
      KeySchema:
        - AttributeName: serviceId
          KeyType: HASH
        - AttributeName: observedAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  HermesInputSnapshotTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: HermesInputSnapshots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hostId
          AttributeType: S
        - AttributeName: capturedAt
          AttributeType: S
      KeySchema:
        - AttributeName: hostId
          KeyType: HASH
        - AttributeName: capturedAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ResearchEventLedgerV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ResearchEventLedgerV2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productKey
          AttributeType: S
        - AttributeName: eventKey
          AttributeType: S
      KeySchema:
        - AttributeName: productKey
          KeyType: HASH
        - AttributeName: eventKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ResearchEntityEventsV1:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ResearchEntityEventsV1
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entityKey
          AttributeType: S
        - AttributeName: eventKey
          AttributeType: S
        - AttributeName: marketDate
          AttributeType: S
        - AttributeName: dateEventKey
          AttributeType: S
      KeySchema:
        - AttributeName: entityKey
          KeyType: HASH
        - AttributeName: eventKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: marketDate-index
          KeySchema:
            - AttributeName: marketDate
              KeyType: HASH
            - AttributeName: dateEventKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ResearchProductManifestsV1:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ResearchProductManifestsV1
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: marketDate
          AttributeType: S
        - AttributeName: productKey
          AttributeType: S
      KeySchema:
        - AttributeName: marketDate
          KeyType: HASH
        - AttributeName: productKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  PredictionMarketCatalogV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PredictionMarketCatalogV2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: releaseKey
          AttributeType: S
        - AttributeName: contractKey
          AttributeType: S
      KeySchema:
        - AttributeName: releaseKey
          KeyType: HASH
        - AttributeName: contractKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  RiskRangePublicationManifestsV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RiskRangePublicationManifestsV2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: publicationDate
          AttributeType: S
        - AttributeName: manifestType
          AttributeType: S
      KeySchema:
        - AttributeName: publicationDate
          KeyType: HASH
        - AttributeName: manifestType
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  RuntimeFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: market-dashboard-runtime-failures-v2
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: market-dashboard-operations-v2

  GmailIngestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: market-dashboard-gmail-ingestor-v2
      CodeUri: lambdas/gmail_ingestor/
      Handler: hermes_gmail_ingestor.lambda_handler
      Description: Cursor-based, immutable Hedgeye Gmail ingestion with typed auth state.
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: !If [ReservedConcurrencyEnabled, 1, !Ref AWS::NoValue]
      Environment:
        Variables:
          GMAIL_OAUTH_SECRET_NAME: !Ref GmailOAuthSecretName
          HERMES_GMAIL_ACCOUNT: !Ref AlertEmail
          HERMES_GMAIL_QUERY: label:Hedgeye newer_than:365d
          HERMES_LEDGER_TABLE: !Ref GmailLedgerTableName
          HERMES_S3_BUCKET: !Ref RawArtifactBucketName
          HEDGEYE_DAILY_SNAPSHOT_TABLE: !Ref HedgeyeDailySnapshotTableName
          RESEARCH_EVENT_LEDGER_TABLE: !Ref ResearchEventLedgerV2
          RESEARCH_ENTITY_EVENTS_TABLE: !Ref ResearchEntityEventsV1
          RESEARCH_PRODUCT_MANIFEST_TABLE: !Ref ResearchProductManifestsV1
          RISK_RANGE_MANIFEST_TABLE: !Ref RiskRangePublicationManifestsV2
          HEDGEYE_RISK_RANGES_TABLE: !Ref HedgeyeRiskRangesTableName
          RISK_RANGE_HISTORY_TABLE: !Ref RiskRangeHistoryTableName
          PDF_PROCESSOR_FUNCTION_NAME: !Ref HedgeyePdfProcessorFunction
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 900
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt RuntimeFailureQueue.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GmailOAuthSecretName}*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GmailLedgerTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HedgeyeDailySnapshotTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HedgeyeRiskRangesTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RiskRangeHistoryTableName}
                - !GetAtt ServiceHeartbeatTable.Arn
                - !GetAtt ResearchEventLedgerV2.Arn
                - !GetAtt ResearchEntityEventsV1.Arn
                - !GetAtt ResearchProductManifestsV1.Arn
                - !GetAtt RiskRangePublicationManifestsV2.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${RawArtifactBucketName}/*
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: MarketDashboard/Readiness
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt RuntimeFailureQueue.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt HedgeyePdfProcessorFunction.Arn
            - Effect: Allow
              Action: textract:AnalyzeDocument
              Resource: '*'

  HedgeyePdfProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: market-dashboard-hedgeye-pdf-processor-v1
      CodeUri: ../aws/lambda/
      Handler: hedgeye_pdf_processor_lambda.lambda_handler
      Description: Parses immutable Hedgeye PDF artifacts and writes verified research projections.
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: !If [ReservedConcurrencyEnabled, 2, !Ref AWS::NoValue]
      Environment:
        Variables:
          HERMES_LEDGER_TABLE: !Ref GmailLedgerTableName
          HEDGEYE_DAILY_SNAPSHOT_TABLE: !Ref HedgeyeDailySnapshotTableName
          RESEARCH_ENTITY_EVENTS_TABLE: !Ref ResearchEntityEventsV1
          RESEARCH_PRODUCT_MANIFEST_TABLE: !Ref ResearchProductManifestsV1
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt RuntimeFailureQueue.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${RawArtifactBucketName}/hedgeye-uploads/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GmailLedgerTableName}
                - !GetAtt ResearchEntityEventsV1.Arn
                - !GetAtt ResearchProductManifestsV1.Arn
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HedgeyeDailySnapshotTableName}
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt RuntimeFailureQueue.Arn
            - Effect: Allow
              Action: textract:AnalyzeDocument
              Resource: '*'

  HermesWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: market-dashboard-hermes-worker-v2
      CodeUri: lambdas/hermes_worker/
      Handler: hermes_worker.lambda_handler
      Description: Consolidated Hermes monitoring workers consuming verified outbound snapshots.
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      ReservedConcurrentExecutions: !If [ReservedConcurrencyEnabled, 3, !Ref AWS::NoValue]
      Environment:
        Variables:
          HERMES_INPUT_SNAPSHOT_TABLE: !Ref HermesInputSnapshotTable
          HERMES_AGENT_RUNS_TABLE: !Ref HermesAgentRunsTableName
          HERMES_ALERTS_TABLE: !Ref HermesAlertsTableName
          HERMES_OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
          HERMES_BRIDGE_HOST_ID: !Ref BridgeHostId
          HERMES_MAX_SNAPSHOT_AGE_SECONDS: 180
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 900
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt RuntimeFailureQueue.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt HermesInputSnapshotTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt ServiceHeartbeatTable.Arn
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HermesAgentRunsTableName}
            - Sid: ManageOwnedHermesAlerts
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HermesAlertsTableName}
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys:
                    - quant-analyst#runtime-health#*
                    - quant-developer#runtime-health#*
                    - security#runtime-health#*
                'Null':
                  dynamodb:LeadingKeys: 'false'
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: MarketDashboard/Readiness
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt RuntimeFailureQueue.Arn
            - Sid: PublishHermesAlertLifecycle
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic

  HermesCloudWatchdogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: market-dashboard-hermes-cloud-watchdog-v1
      CodeUri: lambdas/hermes_watchdog/
      Handler: hermes_watchdog.lambda_handler
      Description: Independent read-only cloud control-plane and heartbeat watchdog.
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 120
      Environment:
        Variables:
          WATCHDOG_STACK_NAME: market-dashboard-readiness-v2
          WATCHDOG_RULE_ID: market-dashboard-hermes-cloud-watchdog-v1
          WATCHDOG_SERVICE_ID: hermes:cloud-watchdog
          HERMES_ALERTS_TABLE: !Ref HermesAlertsTableName
          HERMES_OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
          RUNTIME_FAILURE_QUEUE_URL: !Ref RuntimeFailureQueue
          RUNTIME_FAILURE_QUEUE_NAME: !GetAtt RuntimeFailureQueue.QueueName
          GMAIL_SCHEDULE_ID: market-dashboard-gmail-v2-every-15m
          GMAIL_HEARTBEAT_SERVICE_ID: gmail:timsmithaviation@gmail.com
          QUANT_ANALYST_SCHEDULE_ID: market-dashboard-hermes-quant-analyst-v2
          QUANT_ANALYST_HEARTBEAT_SERVICE_ID: hermes:quant-analyst
          QUANT_DEVELOPER_SCHEDULE_ID: market-dashboard-hermes-quant-developer-v2
          QUANT_DEVELOPER_HEARTBEAT_SERVICE_ID: hermes:quant-developer
          SECURITY_SCHEDULE_ID: market-dashboard-hermes-security-v2
          SECURITY_HEARTBEAT_SERVICE_ID: hermes:security
          GMAIL_FUNCTION_NAME: !Ref GmailIngestorFunction
          PDF_PROCESSOR_FUNCTION_NAME: !Ref HedgeyePdfProcessorFunction
          HERMES_WORKER_FUNCTION_NAME: !Ref HermesWorkerFunction
          WATCHDOG_FUNCTION_NAME: market-dashboard-hermes-cloud-watchdog-v1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadExactReadinessStack
              Effect: Allow
              Action: cloudformation:DescribeStacks
              Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/market-dashboard-readiness-v2/*
            - Sid: ReadExactOwnedSchedules
              Effect: Allow
              Action: scheduler:GetSchedule
              Resource:
                - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/market-dashboard-gmail-v2-every-15m
                - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/market-dashboard-hermes-quant-analyst-v2
                - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/market-dashboard-hermes-quant-developer-v2
                - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/market-dashboard-hermes-security-v2
            - Sid: ReadTypedServiceHeartbeats
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ServiceHeartbeatTable.Arn
            - Sid: WriteTypedWatchdogHeartbeat
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ServiceHeartbeatTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - hermes:cloud-watchdog
                'Null':
                  dynamodb:LeadingKeys: 'false'
            - Sid: WriteOwnedWatchdogAlerts
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HermesAlertsTableName}
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys:
                    - cloud-watchdog#runtime-health#*
                'Null':
                  dynamodb:LeadingKeys: 'false'
            - Sid: ReadExactRuntimeFailureQueue
              Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource: !GetAtt RuntimeFailureQueue.Arn
            - Sid: ReadNativeOperationalMetrics
              Effect: Allow
              Action: cloudwatch:GetMetricData
              # CloudWatch GetMetricData does not support resource-level ARNs;
              # the Lambda issues only exact namespace/dimension queries.
              Resource: '*'
            - Sid: WriteReadinessMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: MarketDashboard/Readiness
            - Sid: PublishWatchdogAlertLifecycle
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: market-dashboard-scheduler-invoke-v2
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-owned-readiness-functions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt GmailIngestorFunction.Arn
                  - !GetAtt HermesWorkerFunction.Arn

  HermesCloudWatchdogRule:
    Type: AWS::Events::Rule
    Properties:
      Name: market-dashboard-hermes-cloud-watchdog-v1
      Description: Independent five-minute read-only cloud reliability watchdog.
      ScheduleExpression: rate(5 minutes)
      State: !Ref CloudWatchdogScheduleState
      Targets:
        - Arn: !GetAtt HermesCloudWatchdogFunction.Arn
          Id: hermes-cloud-watchdog
          Input: '{"source":"aws-events","ruleId":"market-dashboard-hermes-cloud-watchdog-v1"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 0

  HermesCloudWatchdogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HermesCloudWatchdogFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HermesCloudWatchdogRule.Arn

  GmailPollSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: market-dashboard-gmail-v2-every-15m
      Description: Gmail history poll; deliberately disabled until production OAuth promotion.
      State: !Ref GmailScheduleState
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt GmailIngestorFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"source":"aws-scheduler","scheduleId":"market-dashboard-gmail-v2-every-15m","poll":"incremental"}'

  QuantAnalystSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: market-dashboard-hermes-quant-analyst-v2
      Description: Continuous 15-minute readiness monitor; runs 24/7 so missing-heartbeat alarms are meaningful.
      State: !Ref QuantAnalystScheduleState
      ScheduleExpression: cron(0/15 * ? * * *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt HermesWorkerFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"source":"aws-scheduler","scheduleId":"market-dashboard-hermes-quant-analyst-v2","jobType":"quant-analyst"}'

  QuantDeveloperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: market-dashboard-hermes-quant-developer-v2
      Description: Continuous 15-minute readiness monitor; runs 24/7 so missing-heartbeat alarms are meaningful.
      State: !Ref QuantDeveloperScheduleState
      ScheduleExpression: cron(5/15 * ? * * *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt HermesWorkerFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"source":"aws-scheduler","scheduleId":"market-dashboard-hermes-quant-developer-v2","jobType":"quant-developer"}'

  SecuritySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: market-dashboard-hermes-security-v2
      Description: Continuous hourly readiness monitor; runs 24/7 so missing-heartbeat alarms are meaningful.
      State: !Ref SecurityScheduleState
      ScheduleExpression: cron(10 * ? * * *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt HermesWorkerFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"source":"aws-scheduler","scheduleId":"market-dashboard-hermes-security-v2","jobType":"security"}'

  RuntimeFailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: market-dashboard-runtime-failure-queue-v2
      ActionsEnabled: false
      AlarmDescription: Audit-only backlog view; arrival notifications are emitted by the companion arrival alarm.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RuntimeFailureQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RuntimeFailureArrivalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: market-dashboard-runtime-failure-arrival-v2
      ActionsEnabled: !If [OperationalAlarmsEnabled, true, false]
      AlarmDescription: A new Lambda failure entered the no-retry operations queue in the last five minutes.
      Namespace: AWS/SQS
      MetricName: NumberOfMessagesSent
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RuntimeFailureQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  GmailHeartbeatMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: market-dashboard-gmail-heartbeat-missing-v2
      ActionsEnabled: !If [OperationalAlarmsEnabled, true, false]
      Namespace: MarketDashboard/Readiness
      MetricName: Heartbeat
      Dimensions:
        - Name: ServiceId
          Value: gmail:timsmithaviation@gmail.com
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: !If [OperationalAlarmsEnabled, breaching, notBreaching]
      AlarmActions: [!Ref OperationsTopic]

  GmailUnhealthyAlarm:
