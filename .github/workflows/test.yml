name: Reliability verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Supervisor, bridge, readiness, controller, and UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify JavaScript contracts, UI, lint, and build
        env:
          CI: "true"
        run: node scripts/testing/verify.cjs node

  sidecars:
    name: Isolated Python sidecar contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sidecar: [ibkr, analyst]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: node scripts/testing/verify.cjs setup-${{ matrix.sidecar }}
      - name: Verify sidecar contracts
        run: node scripts/testing/verify.cjs ${{ matrix.sidecar }}

  infrastructure:
    name: Infrastructure, Gmail, contracts, and SAM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install infrastructure test dependencies
        run: python -m pip install --disable-pip-version-check boto3 pyyaml

      - uses: aws-actions/setup-sam@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Verify infrastructure, generated contracts and SAM
        run: node scripts/testing/verify.cjs infra
